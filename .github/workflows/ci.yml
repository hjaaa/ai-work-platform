name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-ci:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 编译并运行单元测试
        run: mvn test --batch-mode

  frontend-ci:
    name: 前端构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: platform-frontend

      - name: 构建前端
        run: npm run build
        working-directory: platform-frontend
