server:
  port: 4010

management:
  health:
    readinessstate:
      enabled: true
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,physicalPreconditions

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: ${NACOS_HOST:ai-work-register}:${NACOS_PORT:8848}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
    gateway.server.webflux:
      redis.enabled: false
      enabled: false
  config:
    import:
      - optional:nacos:application-@profiles.active@.yml
      - optional:nacos:${spring.application.name}-@profiles.active@.yml

baas:
  ddl:
    maintenance-interval-millis: 300000
    stale-running-minutes: 10
