openapi: 3.0.3
info:
  title: ai-work BaaS 数据面 API
  version: 0.1.0
  description: |
    PostgREST-inspired 简化子集(spec §7.1)。所有路径相对 base_url = 外部前缀 + /data/{projectRef}。
    Cloud 形态外部前缀 http://gw:9999/baas,Boot 形态 http://host:9999/admin。
    差异与限制:
    - like 通配符 %/_ 原样传递,不做 PostgREST 的 * → % 转换
    - bigint(含 id 与 owner 列)以 JSON number 原样输出,JavaScript 侧超过 2^53 有精度风险
    - json 列写入的 JSON literal null 与 SQL NULL 不区分(显式 null 恒为 SQL NULL)
    - 关联/嵌套查询、OR 过滤、聚合不支持
servers:
  - url: /
security:
  - apiKey: []
paths:
  /rest/v1/{table}:
    parameters:
      - $ref: '#/components/parameters/table'
    get:
      summary: 按条件查询
      description: |
        过滤条件为 查询参数 列名=操作符.值,操作符:eq/neq/gt/gte/lt/lte/like/in/is。
        in 语法 col=in.(a,b,c),不支持值内嵌逗号与引号转义;is 仅 is.null / is.not_null;
        json 列仅支持 is 过滤;多条件之间为 AND;同名参数多次出现为多个 AND 条件。
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/preferCount'
        - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          description: 行数组;零匹配返回 [](不是 404);Prefer count=exact 时响应头含 Content-Range
          headers:
            Content-Range:
              schema: { type: string, example: 0-19/87 }
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/badRequest' }
        '401': { $ref: '#/components/responses/unauthorized' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '413': { $ref: '#/components/responses/tooLarge' }
        '429': { $ref: '#/components/responses/rateLimited' }
        '500': { $ref: '#/components/responses/internal' }
    post:
      summary: 单条或数组批量插入(批量为单事务原子,任一行失败整体回滚)
      description: |
        body 为对象或对象数组(≤1000 行);数组各行字段集合必须一致;body 含 id 列一律 400;
        配置 owner 列的表:anon/authenticated 的 body 不得包含 owner 列;
        Prefer return=representation 需同时具备 insert 与 select 权限,返回完整行(≤1000 行、≤16 MiB)。
      parameters:
        - $ref: '#/components/parameters/preferReturn'
        - $ref: '#/components/parameters/authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items: { type: object }
      responses:
        '201':
          description: 默认返回主键数组 [{"id":1},…];representation 时返回完整行数组
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/badRequest' }
        '401': { $ref: '#/components/responses/unauthorized' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '413': { $ref: '#/components/responses/tooLarge' }
        '429': { $ref: '#/components/responses/rateLimited' }
        '500': { $ref: '#/components/responses/internal' }
    patch:
      summary: 按条件更新(必须携带至少一个过滤条件)
      description: |
        默认返回 {"count":n},匹配零行返回 200 + 0;
        Prefer return=representation 需同时具备 update 与 select 权限,按捕获主键返回被改行,
        匹配超过 1000 行返回 400。
      parameters:
        - $ref: '#/components/parameters/preferReturn'
        - $ref: '#/components/parameters/authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: '{"count":n} 或(representation)完整行数组'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { count: { type: integer } }
                  - type: array
                    items: { type: object }
        '400': { $ref: '#/components/responses/badRequest' }
        '401': { $ref: '#/components/responses/unauthorized' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '413': { $ref: '#/components/responses/tooLarge' }
        '429': { $ref: '#/components/responses/rateLimited' }
        '500': { $ref: '#/components/responses/internal' }
    delete:
      summary: 按条件删除(必须携带至少一个过滤条件;不支持 representation)
      parameters:
        - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          description: '{"count":n}'
          content:
            application/json:
              schema:
                type: object
                properties: { count: { type: integer } }
        '400': { $ref: '#/components/responses/badRequest' }
        '401': { $ref: '#/components/responses/unauthorized' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '500': { $ref: '#/components/responses/internal' }
  /auth/v1/signup:
    post:
      summary: 注册(即视为邮箱已确认;注册即登录,响应与 login 同构)
      description: |
        邮箱 trim + 小写规范化;密码 8-72 字节(UTF-8),bcrypt 编码存储;
        邮箱已被占用(含软删用户,唯一键不释放)返回 409;
        项目不可用或系统表升级未完成时 fail-closed 返回 403;
        (项目,IP)维度限速 10 次/小时(无论成败),超限 429 + Retry-After(窗口剩余秒)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, description: 自动 trim + 小写规范化 }
                password: { type: string, description: 8-72 字节(UTF-8) }
      responses:
        '200': { $ref: '#/components/responses/authSession' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403':
          description: 项目不可用或系统表升级未完成(fail-closed)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: 该邮箱已被注册(含软删用户,邮箱唯一键不释放)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: 触发防暴力限速
          headers:
            Retry-After:
              schema: { type: integer }
              description: 窗口剩余秒数
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/internal' }
  /auth/v1/token:
    post:
      summary: 登录(grant_type=password)或刷新(grant_type=refresh_token)
      description: |
        登录:邮箱不存在/密码错误/用户已软删统一返回 401「邮箱或密码错误」(不泄露账户状态);
        受(项目,邮箱)5 次/15 分钟与(项目,IP)30 次/15 分钟限速,登录成功清空邮箱计数。
        刷新:一次性轮换,10 秒 reuse grace 内重放返回同一响应(幂等);超窗重放判定为令牌泄露,
        撤销整个会话后返回 401;refresh 不限速。
      parameters:
        - name: grant_type
          in: query
          required: true
          schema: { type: string, enum: [password, refresh_token] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: grant_type=password 时须含 {email,password};grant_type=refresh_token 时须含 {refresh_token}
              properties:
                email: { type: string }
                password: { type: string }
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/authSession' }
        '400': { $ref: '#/components/responses/badRequest' }
        '401':
          description: 凭据错误、刷新令牌无效/已过期,或刷新令牌超窗重放判定泄露(会话已撤销)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: 项目不可用或系统表升级未完成(fail-closed)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: 触发登录防暴力限速(仅 grant_type=password)
          headers:
            Retry-After:
              schema: { type: integer }
              description: 窗口剩余秒数
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/internal' }
  /auth/v1/logout:
    post:
      summary: 注销(仅撤销当前 access JWT 所指会话;幂等)
      description: 已签发的 access JWT 在 TTL 内仍可解出该会话身份(无黑名单,即时失效依赖紧急密钥轮换)。
      parameters:
        - $ref: '#/components/parameters/authorization'
      responses:
        '204': { description: 已注销(会话已撤销时重复调用仍返回 204) }
        '401':
          description: 缺少或无效的 access JWT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: 项目不可用或系统表升级未完成(fail-closed)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/internal' }
  /auth/v1/user:
    get:
      summary: 取当前用户
      description: 账户管理端点;已软删用户即便持 TTL 内有效 access JWT 也返回 401(与 /rest/v1 数据面不回查软删状态不同)。
      parameters:
        - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  email: { type: string }
                  createTime: { type: string, example: '2026-07-22 12:00:00' }
        '401':
          description: 缺少/无效 access JWT,或用户已软删
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: 项目不可用或系统表升级未完成(fail-closed)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/internal' }
  /auth/v1/user/password:
    put:
      summary: 修改密码(须提交当前密码;成功后撤销该用户全部会话,含当前)
      description: |
        currentPassword 与 newPassword 均须 8-72 字节(UTF-8);currentPassword 错误计入登录防暴力
        限速(邮箱与 IP 维度,与 login 共用同一桶);已软删用户返回 401。
      parameters:
        - $ref: '#/components/parameters/authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, description: 8-72 字节(UTF-8) }
                newPassword: { type: string, description: 8-72 字节(UTF-8) }
      responses:
        '204': { description: 已修改,该用户全部会话已撤销(含当前) }
        '400': { $ref: '#/components/responses/badRequest' }
        '401':
          description: 当前密码错误、access JWT 无效,或用户已软删
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: 项目不可用或系统表升级未完成(fail-closed)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: 触发登录防暴力限速(currentPassword 错误计入)
          headers:
            Retry-After:
              schema: { type: integer }
              description: 窗口剩余秒数
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/internal' }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: publishable key(anon/authenticated)或 secret key(service_role,仅服务端)
  parameters:
    table:
      name: table
      in: path
      required: true
      schema: { type: string }
      description: 表名;_ 前缀系统表不可见(404)
    authorization:
      name: Authorization
      in: header
      required: false
      schema: { type: string, example: Bearer <access JWT> }
      description: 终端用户 access JWT;仅可与 publishable key 组合,secret key 携带 JWT 返回 401
    select:
      name: select
      in: query
      required: false
      schema: { type: string, example: id,name }
      description: 逗号分隔投影列;缺省全列
    order:
      name: order
      in: query
      required: false
      schema: { type: string, example: created_at.desc,name }
      description: 逗号分隔,每列可选 .asc/.desc,缺省 asc
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 100, maximum: 1000, minimum: 1 }
    offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0, minimum: 0 }
    preferCount:
      name: Prefer
      in: header
      required: false
      schema: { type: string, example: count=exact }
      description: count=exact 时以同过滤条件执行第二条 COUNT 并返回 Content-Range
    preferReturn:
      name: Prefer
      in: header
      required: false
      schema: { type: string, example: return=representation }
  schemas:
    Error:
      type: object
      description: PostgREST 风格错误体(spec §11)
      properties:
        code: { type: string, example: BAD_REQUEST }
        message: { type: string }
        details: { type: string, nullable: true }
        hint: { type: string, nullable: true }
  responses:
    authSession:
      description: 会话响应(signup/login/refresh 同构)
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token: { type: string, description: access JWT,TTL 见 expires_in }
              token_type: { type: string, example: bearer }
              expires_in: { type: integer, example: 3600, description: access_token 有效期(秒) }
              refresh_token: { type: string, description: 一次性令牌,使用后即失效(reuse grace 10 秒) }
              user:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  email: { type: string }
                  createTime: { type: string, example: '2026-07-22 12:00:00' }
    badRequest:
      description: 语法/列名/值类型非法、批量键集合不一致、representation 超行数上限等
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    unauthorized:
      description: apikey 无效、三方项目标识不一致、JWT 无效、secret key 携带 JWT
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    forbidden:
      description: ACL/owner 策略拒绝、representation 缺 select 权限、项目或表暂不可用
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    notFound:
      description: 表不存在(含 tombstone 与系统表)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    conflict:
      description: 唯一键冲突或约束违反
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    tooLarge:
      description: 请求体超 1 MB 或响应体超 16 MiB(representation 超限时写入已回滚)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    rateLimited:
      description: 并发响应构建繁忙(信号量耗尽)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    internal:
      description: SQL 执行超时或内部错误(message 脱敏)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
