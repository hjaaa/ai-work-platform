spring:
  data:
    redis:
      host: ai-work-redis
      database: 5
      timeout: ${BAAS_REDIS_COMMAND_TIMEOUT:2s}
  # 数据库相关配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: root
      password: root
      url: jdbc:mysql://ai-work-mysql:3306/ai_work?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true

# 文件上传配置
file:
  type: local
  local:
    base-path: /Users/lengleng/Downloads/img

# 验证码配置
aj:
  captcha:
    water-mark: aiwork

# 登录报文加密根密钥 ，必须是16位
security:
  encodeKey: aiwork2026aiwork

# 配置文件加密根密码
jasypt:
  encryptor:
    password: aiwork

# swagger token url 配置
swagger:
  token-url: ${swagger.gateway}/admin/oauth2/token

# BaaS 项目库入口与开通账号(单体形态;主密钥经环境变量 BAAS_MASTER_KEYS 注入)
baas:
  provisioner:
    url: jdbc:mysql://ai-work-mysql:3306/mysql?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root
  project-db:
    host: ai-work-mysql
    port: 3306
