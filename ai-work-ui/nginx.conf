# ai-work-ui 站点配置：托管 Vite 构建产物，并把 /api 前缀反代到网关（容器网络内服务名 ai-work-gateway）
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 头像、文件上传都经 /api 转发，放宽 nginx 默认 1m 限制，避免 413
    client_max_body_size 50m;

    # vue-router history 模式：非静态文件路径统一回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/xxx → http://ai-work-gateway:9999/xxx，去掉 /api 前缀，与 vite.config.ts 的开发代理保持一致。
    # 用 Docker 内置 DNS 在运行时解析上游：网关容器晚于本容器启动、或被重建换了 IP，都不需要重启 nginx。
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $gateway http://ai-work-gateway:9999;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
