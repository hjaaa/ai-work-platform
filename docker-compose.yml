# 使用说明 4.0 - 微服务架构版本
# 1. 使用docker-compose  宿主机不需要配置host来发现
# 2. 无需修改源码，根目录  docker-compose up 即可
# 3. 静静等待服务启动
#
# 数据持久化：容器默认无卷，删除/重建即丢数据。以下两个环境变量控制宿主机落点，
# 不配置时落到仓库内 ./docker-data（已在 .gitignore 忽略）：
#   AI_WORK_INFRA_ROOT  基础设施数据（MySQL 数据目录、Nacos data/logs）
#   AI_WORK_LOG_ROOT    各服务应用日志（logback 输出的 debug.log/error.log）
# 建议指向仓库外目录，避免 git clean -xfd 连同数据一并删除。
services:
  ai-work-mysql:
    build:
      context: ./db
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: root
    restart: always
    container_name: ai-work-mysql
    image: ai-work-mysql
    command: --lower_case_table_names=1
    ports:
      - 3306:3306
    volumes:
      # 数据目录为空时才会执行镜像内的种子 SQL，已有数据的目录直接复用
      - ${AI_WORK_INFRA_ROOT:-./docker-data/infra}/mysql/data:/var/lib/mysql
    networks:
      - spring_cloud_default

  ai-work-redis:
    container_name: ai-work-redis
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub_mirror/redis
    restart: always
    networks:
      - spring_cloud_default

  ai-work-register:
    build:
      context: ./ai-work-register
    restart: always
    container_name: ai-work-register
    image: ai-work-register
    ports:
      - 8848:8848
      - 9848:9848
      - 18080:18080
    volumes:
      # raft 协议数据（服务注册状态）；Nacos 的配置数据存在 MySQL 的 ai_work_config 库
      - ${AI_WORK_INFRA_ROOT:-./docker-data/infra}/nacos/data:/root/nacos/data
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/register:/ai-work-register/logs
    networks:
      - spring_cloud_default

  ai-work-gateway:
    build:
      context: ./ai-work-gateway
    restart: always
    container_name: ai-work-gateway
    image: ai-work-gateway
    ports:
      - 9999:9999
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/gateway:/ai-work-gateway/logs
    networks:
      spring_cloud_default:
        ipv4_address: 172.28.0.10

  ai-work-auth:
    build:
      context: ./ai-work-auth
    restart: always
    container_name: ai-work-auth
    image: ai-work-auth
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/auth:/ai-work-auth/logs
    networks:
      - spring_cloud_default

  ai-work-upms:
    build:
      context: ./ai-work-upms/ai-work-upms-biz
    restart: always
    container_name: ai-work-upms
    image: ai-work-upms
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/upms:/ai-work-upms/logs
    networks:
      - spring_cloud_default

  ai-work-baas:
    build:
      context: ./ai-work-baas
    restart: always
    container_name: ai-work-baas
    image: ai-work-baas
    environment:
      BAAS_MASTER_KEYS: ${BAAS_MASTER_KEYS:?BAAS_MASTER_KEYS 未配置}
      BAAS_ACTIVE_KEY_ID: ${BAAS_ACTIVE_KEY_ID:-k1}
      BAAS_TRUSTED_PROXIES: 172.28.0.10/32
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/baas:/ai-work-baas/logs
    networks:
      - spring_cloud_default

  ai-work-monitor:
    build:
      context: ./ai-work-visual/ai-work-monitor
    restart: always
    image: ai-work-monitor
    container_name: ai-work-monitor
    ports:
      - 5001:5001
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/monitor:/ai-work-monitor/logs
    networks:
      - spring_cloud_default

  ai-work-quartz:
    build:
      context: ./ai-work-visual/ai-work-quartz
    restart: always
    image: ai-work-quartz
    container_name: ai-work-quartz
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/quartz:/ai-work-quartz/logs
    networks:
      - spring_cloud_default

  ai-work-codegen:
    build:
      context: ./ai-work-visual/ai-work-codegen
    restart: always
    image: ai-work-codegen
    container_name: ai-work-codegen
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/codegen:/ai-work-codegen/logs
    networks:
      - spring_cloud_default

networks:
  spring_cloud_default:
    name: spring_cloud_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
