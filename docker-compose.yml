# 使用说明 4.0 - 微服务架构版本
# 1. 使用docker-compose  宿主机不需要配置host来发现
# 2. 无需修改源码，根目录  docker-compose up 即可
# 3. 静静等待服务启动
#
# 前置依赖：MySQL / Redis / Nacos 已拆分为跨项目共享的公共基础设施栈，
# 不再由本文件编排。启动本栈前需先准备好：
#   1) 公共网络（一次性创建）：
#      docker network create --driver bridge \
#        --subnet 172.28.0.0/16 --ip-range 172.28.1.0/24 dev-infra-net
#      网段必须是 172.28.0.0/16：下方 ai-work-gateway 钉死在 172.28.0.10，
#      ai-work-baas 的 BAAS_TRUSTED_PROXIES 白名单依赖该地址。
#      --ip-range 把动态分配池圈在 172.28.1.0/24，避免 172.28.0.10 被别的容器动态占走。
#   2) 公共基础设施栈已启动（提供 dev-mysql / dev-redis / dev-nacos）：
#      docker compose -f ~/docker-data/infra/docker-compose.yml up -d
#
# 数据持久化：以下环境变量控制各服务应用日志（logback 输出的 debug.log/error.log）
# 在宿主机的落点，不配置时落到仓库内 ./docker-data（已在 .gitignore 忽略）：
#   AI_WORK_LOG_ROOT    各服务应用日志
# 建议指向仓库外目录，避免 git clean -xfd 连同数据一并删除。
# 基础设施数据（MySQL 数据目录、Nacos data/logs）已移交公共栈管理。
services:
  ai-work-gateway:
    build:
      context: ./ai-work-gateway
    container_name: ai-work-gateway
    image: ai-work-gateway
    environment:
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    ports:
      # 宿主机侧映射为 19999，避开本机其他项目常占用的 9999（xxl-job 执行器默认端口）；容器内仍为 9999
      - 19999:9999
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/gateway:/ai-work-gateway/logs
    networks:
      dev-infra-net:
        ipv4_address: 172.28.0.10

  ai-work-auth:
    build:
      context: ./ai-work-auth
    container_name: ai-work-auth
    image: ai-work-auth
    environment:
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/auth:/ai-work-auth/logs
    networks:
      - dev-infra-net

  ai-work-upms:
    build:
      context: ./ai-work-upms/ai-work-upms-biz
    container_name: ai-work-upms
    image: ai-work-upms
    environment:
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/upms:/ai-work-upms/logs
    networks:
      - dev-infra-net

  ai-work-baas:
    build:
      context: ./ai-work-baas
    container_name: ai-work-baas
    image: ai-work-baas
    environment:
      BAAS_MASTER_KEYS: ${BAAS_MASTER_KEYS:?BAAS_MASTER_KEYS 未配置}
      BAAS_ACTIVE_KEY_ID: ${BAAS_ACTIVE_KEY_ID:-k1}
      BAAS_TRUSTED_PROXIES: 172.28.0.10/32
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/baas:/ai-work-baas/logs
    networks:
      - dev-infra-net

  ai-work-monitor:
    build:
      context: ./ai-work-visual/ai-work-monitor
    image: ai-work-monitor
    container_name: ai-work-monitor
    environment:
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    ports:
      # 宿主机侧映射为 15001，避开本机其他项目占用的 5001；容器内仍为 5001
      - 15001:5001
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/monitor:/ai-work-monitor/logs
    networks:
      - dev-infra-net

  ai-work-quartz:
    build:
      context: ./ai-work-visual/ai-work-quartz
    image: ai-work-quartz
    container_name: ai-work-quartz
    environment:
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/quartz:/ai-work-quartz/logs
    networks:
      - dev-infra-net

  ai-work-codegen:
    build:
      context: ./ai-work-visual/ai-work-codegen
    image: ai-work-codegen
    container_name: ai-work-codegen
    environment:
      MYSQL_HOST: dev-mysql
      REDIS_HOST: dev-redis
      NACOS_HOST: dev-nacos
    volumes:
      - ${AI_WORK_LOG_ROOT:-./docker-data/logs}/codegen:/ai-work-codegen/logs
    networks:
      - dev-infra-net

networks:
  dev-infra-net:
    external: true
