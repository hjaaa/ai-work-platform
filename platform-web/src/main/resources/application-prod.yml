# ========== 生产环境 ==========

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://prod-db:3306/ai_work_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ai_platform
    password: ${DB_PASSWORD}
  data:
    redis:
      host: prod-redis
      port: 6379
      password: ${REDIS_PASSWORD}

ai:
  orchestrator:
    claude-cli-path: /usr/local/bin/claude
    workspace-base-path: /data/workspace/projects
    max-concurrent: 2
    timeout-minutes: 10
  deploy:
    docker-registry: registry.prod.internal:5000
    health-check-timeout-seconds: 120
    health-check-interval-seconds: 5
    servers:
      - name: prod-server
        host: ${DEPLOY_HOST}
        username: deploy
        private-key-path: /home/deploy/.ssh/id_rsa
        deploy-path: /opt/deploy
