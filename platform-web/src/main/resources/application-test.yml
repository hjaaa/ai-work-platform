# ========== 测试环境 ==========

spring:
  datasource:
    url: jdbc:mysql://test-db:3306/ai_work_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ai_platform
    password: ${DB_PASSWORD:test_password}
  data:
    redis:
      host: test-redis
      port: 6379

ai:
  orchestrator:
    claude-cli-path: /usr/local/bin/claude
    workspace-base-path: /data/workspace/projects
    max-concurrent: 3
    timeout-minutes: 5
  deploy:
    docker-registry: registry.test.internal:5000
    health-check-timeout-seconds: 60
    health-check-interval-seconds: 5
    servers:
      - name: test-server
        host: 10.0.1.5
        username: deploy
        private-key-path: /home/deploy/.ssh/id_rsa
        deploy-path: /opt/deploy
