# 需求元信息模板
# 使用方式：复制本文件到 requirements/{requirement-id}/meta.yaml 并填写

requirement_id: ""          # 需求 ID（如 REQ-001）
title: ""                   # 需求标题
status: "not_started"       # 状态：not_started / in_progress / blocked / completed
current_phase: "analysis"   # 当前阶段：analysis / design / implementation / review / done
related_services: []        # 关联服务列表
created_at: ""              # 创建时间
updated_at: ""              # 最近更新时间
blocked_by: ""              # 阻塞原因（如有）
